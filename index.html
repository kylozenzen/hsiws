<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#180B18">
<title>Swish — 5 balls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#180B18; --ball:#FF7A2F; --rim:#FF4757;
    --gold:#FFD84D; --go:#78FFB4; --ink:#FFF4E6; --dim:rgba(255,244,230,.52);
    --panel:rgba(24,11,24,.92); --line:rgba(255,244,230,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);touch-action:none;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);color:var(--ink);
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;z-index:2}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start}
  .stat{display:flex;flex-direction:column;line-height:1}
  .stat b{font-family:Anton,ui-sans-serif,sans-serif;font-size:36px;letter-spacing:.02em;font-weight:400}
  .stat span{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:6px}
  .stat.mid{align-items:center;text-align:center}
  .stat.right{align-items:flex-end;text-align:right}
  .stat.right b{color:var(--gold);transition:color .2s}
  .stat.right.hot b{color:#FF6B2C;text-shadow:0 0 18px rgba(255,107,44,.85)}
  .dots{display:flex;gap:6px;height:36px;align-items:center}
  .dots i{width:11px;height:11px;border-radius:50%;background:var(--ball);
    box-shadow:0 0 10px rgba(255,122,47,.55)}
  .dots i.spent{background:transparent;border:1px solid var(--line);box-shadow:none}

  #shot{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 22px);
    width:116px;height:116px;border-radius:50%;z-index:15;
    background:radial-gradient(circle at 34% 30%,rgba(255,167,97,.28),rgba(216,83,26,.16));
    border:3px solid rgba(255,122,47,.55);
    font-family:Anton,ui-sans-serif,sans-serif;font-size:20px;letter-spacing:.12em;
    display:grid;place-items:center;line-height:1;
    box-shadow:0 0 34px rgba(255,122,47,.18);transition:border-color .1s,box-shadow .1s}
  #shot.hidden{display:none}
  #shot.now{border-color:var(--go);color:var(--go);box-shadow:0 0 50px rgba(120,255,180,.5)}
  #shot.over{border-color:rgba(255,71,87,.65);color:rgba(255,244,230,.55)}

  .utils{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 22px);
    display:flex;gap:7px;z-index:20}
  .utils button{font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:10px 13px}
  .utils button:active{background:rgba(255,122,47,.26)}
  #reset{color:var(--rim);border-color:rgba(255,71,87,.45)}

  #verdict{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;z-index:4;
    font-family:Anton,ui-sans-serif,sans-serif;font-size:clamp(40px,13vw,76px);
    letter-spacing:.01em;line-height:.9;opacity:0;color:var(--gold)}
  #verdict.show{animation:slam .72s cubic-bezier(.16,1,.3,1) forwards}
  #verdict.miss{color:var(--dim);font-size:clamp(24px,7.5vw,40px)}
  #verdict.fire{color:#FF6B2C;text-shadow:0 0 30px rgba(255,107,44,.9)}
  @keyframes slam{0%{opacity:0;transform:scale(1.5) rotate(-4deg)}
    16%,70%{opacity:1;transform:scale(1) rotate(-1.5deg)}
    100%{opacity:0;transform:scale(.96) rotate(-1.5deg)}}
  #coach{position:fixed;left:16px;right:16px;top:52%;text-align:center;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    pointer-events:none;transition:opacity .4s;z-index:3;line-height:1.8}
  #coach.hide{opacity:0}

  #overlay{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:24px;
    background:radial-gradient(ellipse at 50% 34%,rgba(74,35,32,.72),rgba(16,6,16,.95));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  #overlay.show{opacity:1;pointer-events:auto}
  .card{width:100%;max-width:340px;text-align:center}
  .eyebrow{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--ball);margin:0 0 14px}
  .card h1{font-family:Anton,ui-sans-serif,sans-serif;font-weight:400;margin:0;
    font-size:clamp(58px,20vw,96px);line-height:.86}
  .card h1 em{font-style:normal;color:var(--gold)}
  .card p.sub{font-size:13px;line-height:1.6;color:var(--dim);margin:16px 0 26px}
  .breakdown{display:flex;justify-content:center;gap:24px;margin:22px 0 28px}
  .breakdown div{display:flex;flex-direction:column;gap:6px}
  .breakdown b{font-family:Anton,ui-sans-serif,sans-serif;font-weight:400;font-size:26px}
  .breakdown span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  #start{width:100%;border-radius:14px;padding:19px 0;
    font-family:Anton,ui-sans-serif,sans-serif;font-size:16px;letter-spacing:.22em;
    background:var(--ball);border-color:var(--ball);color:#22090A}
  .best{margin-top:16px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  #scrim{position:fixed;inset:0;background:rgba(10,4,10,.55);z-index:29;opacity:0;
    pointer-events:none;transition:opacity .28s}
  #scrim.open{opacity:1;pointer-events:auto}
  #tuner{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(101%);transition:transform .3s cubic-bezier(.16,1,.3,1);
    max-height:78vh;overflow-y:auto}
  #tuner.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
  #tuner h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin:0 0 12px;font-weight:600}
  .row{display:grid;grid-template-columns:84px 1fr 46px;align-items:center;gap:10px;margin-bottom:13px}
  .row label{font-size:11px;color:var(--dim)}
  .row output{font-size:11px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ball)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;
    background:var(--line);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    border-radius:50%;background:var(--ball);border:none}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ball);border:none}
  .seg{display:flex;gap:6px;margin-bottom:16px}
  .seg button{flex:1;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    border-radius:10px;padding:12px 0;background:transparent}
  .seg button[aria-pressed=true]{background:rgba(255,122,47,.22);border-color:var(--ball);color:var(--ball)}
  #done{width:100%;margin-top:6px;border-radius:12px;padding:15px 0;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;
    background:rgba(255,122,47,.2);border-color:var(--ball);color:var(--ball)}
  @media (prefers-reduced-motion:reduce){#verdict.show{animation-duration:.01s}
    #tuner,#scrim,#overlay{transition:none}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <div class="topbar">
    <div class="stat" id="scoreWrap"><b id="score">0</b><span>Score</span></div>
    <div class="stat mid"><div class="dots" id="dots"></div><span>Balls</span></div>
    <div class="stat right" id="streakWrap"><b id="streak">0</b><span>Streak</span></div>
  </div>
</div>

<div id="verdict"></div>
<div id="coach"></div>

<button id="shot" class="hidden"><span id="shotLabel">SHOOT</span></button>

<div class="utils">
  <button id="tune">Tune</button>
  <button id="sound">Sound</button>
  <button id="reset">Reset</button>
</div>

<div id="overlay" class="show"><div class="card" id="card"></div></div>

<div id="scrim"></div>
<div id="tuner" role="dialog" aria-label="Feel controls">
  <div class="grab"></div>
  <h2>Control</h2>
  <div class="seg">
    <button id="m-hold" aria-pressed="true">Hold to shoot</button>
    <button id="m-flick" aria-pressed="false">Swipe to shoot</button>
  </div>
  <h2>Feel</h2>
  <div class="row"><label for="s-charge">Meter speed</label><input id="s-charge" type="range" min="0.2" max="1.2" step="0.05" value="0.45"><output id="o-charge"></output></div>
  <div class="row"><label for="s-power">Power</label><input id="s-power" type="range" min="9" max="18" step="0.5" value="13"><output id="o-power"></output></div>
  <div class="row"><label for="s-grav">Gravity</label><input id="s-grav" type="range" min="7" max="16" step="0.2" value="10.2"><output id="o-grav"></output></div>
  <div class="row"><label for="s-assist">Rim assist</label><input id="s-assist" type="range" min="0" max="1" step="0.05" value="0.55"><output id="o-assist"></output></div>
  <div class="row"><label for="s-slomo">Slow-mo</label><input id="s-slomo" type="range" min="0" max="1" step="0.05" value="0.2"><output id="o-slomo"></output></div>
  <div class="row"><label for="s-whip">Net whip</label><input id="s-whip" type="range" min="0" max="1" step="0.05" value="0.55"><output id="o-whip"></output></div>
  <div class="row"><label for="s-juice">Juice</label><input id="s-juice" type="range" min="0" max="1" step="0.05" value="1"><output id="o-juice"></output></div>
  <div class="row"><label for="s-guide">Hoop guide</label><input id="s-guide" type="range" min="0" max="2" step="1" value="1"><output id="o-guide"></output></div>
  <div class="row"><label for="s-barpos">Bar height</label><input id="s-barpos" type="range" min="0.42" max="0.76" step="0.02" value="0.62"><output id="o-barpos"></output></div>
  <button id="done">Done</button>
</div>

<script>
(() => {
'use strict';

/* ================= WORLD ================= */
const HOOP_Z=6.0,RIM_Y=3.05,RIM_R=0.225,BALL_R=0.12;
const BOARD_Z=6.34,BOARD_X=0.95,BOARD_TOP=4.22;
const LAUNCH_Y=1.35,LAUNCH_Z=0.50,TAU=Math.PI*2;
const MAKE_R=RIM_R-BALL_R*0.25;
const BALLS_PER_ROUND=5,HEAT_AT=3;
const SP_MIN=0.50,SP_SPAN=0.55;

const P={maxSpeed:13,gravity:10.2,assist:0.55,slomo:0.2,whip:0.55,
         charge:0.45,guide:1,juice:1,barpos:0.62};
let mode='hold';

/* ================= CANVAS ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,cx=0,groundY=0,PPM=150,RISE=34;
const DEPTH_K=0.075;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2.5);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const k=H/800;PPM=150*k;RISE=34*k;cx=W/2;groundY=H*0.92;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));
const dS=z=>1/(1+z*DEPTH_K);
function px(x,y,z){const s=dS(z);return{x:cx+x*PPM*s,y:groundY-y*PPM*s-z*RISE,s};}

/* ================= AUDIO ================= */
let AC=null,MASTER=null,NOISE=null,soundOn=true;
function audio(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    AC=new C();MASTER=AC.createGain();MASTER.gain.value=.85;MASTER.connect(AC.destination);
    const n=AC.sampleRate;NOISE=AC.createBuffer(1,n,n);
    const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function nv(ac,t,{type,freq,q=1,peak,dur,ramp,attack=.01}){
  const s=ac.createBufferSource();s.buffer=NOISE;s.playbackRate.value=.85+Math.random()*.3;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);f.Q.value=q;
  if(ramp)f.frequency.exponentialRampToValueAtTime(ramp,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+attack);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+dur+.05);
}
function tn(ac,t,f0,peak,dur,type='triangle'){
  const o=ac.createOscillator();o.type=type;
  o.frequency.setValueAtTime(f0*(.995+Math.random()*.01),t);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.05);
}
const S={
  swish(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    nv(a,t,{type:'bandpass',freq:4600,q:1.3,peak:.5,dur:.24,ramp:900});
    nv(a,t+.02,{type:'bandpass',freq:2400,q:2.2,peak:.22,dur:.16,ramp:700});},
  rim(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    [1390,2110,3180].forEach((f,i)=>tn(a,t,f,.2/(i+1),.13));
    nv(a,t,{type:'highpass',freq:2600,peak:.16,dur:.05});},
  board(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    nv(a,t,{type:'lowpass',freq:520,peak:.42,dur:.11});tn(a,t,168,.16,.1,'sine');},
  bounce(v){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    const o=a.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(135,t);o.frequency.exponentialRampToValueAtTime(58,t+.12);
    const g=a.createGain();g.gain.setValueAtTime(Math.min(.34,.05+v*.045),t);
    g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.2);},
  ladder(n){const a=audio();if(!a||!soundOn)return;const t=a.currentTime+.05;
    const f=392*Math.pow(2,Math.min(n,12)/12);tn(a,t,f,.2,.34);tn(a,t,f*1.5,.09,.3,'sine');},
  crowd(i){const a=audio();if(!a||!soundOn)return;
    nv(a,a.currentTime,{type:'bandpass',freq:900,q:.55,peak:.05+.10*i,dur:1.1,attack:.22});},
  groan(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    nv(a,t,{type:'lowpass',freq:420,peak:.05,dur:.7,attack:.18});
    tn(a,t+.05,240,.05,.45,'sine');},
  perfect(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    [1046,1318,1568].forEach((f,i)=>tn(a,t+i*.045,f,.13,.2,'sine'));},
  ignite(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    nv(a,t,{type:'bandpass',freq:400,q:.8,peak:.28,dur:.7,ramp:3200,attack:.06});
    [131,196,262].forEach((f,i)=>tn(a,t+i*.05,f,.16,.6,'sawtooth'));},
  tick(f,v){const a=audio();if(!a||!soundOn)return;tn(a,a.currentTime,f,v,.03,'square');},
  enter(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    tn(a,t,784,.14,.09,'sine');tn(a,t+.02,1175,.08,.1,'sine');},
  leave(){const a=audio();if(!a||!soundOn)return;tn(a,a.currentTime,330,.06,.07,'sine');},
  beep(hi){const a=audio();if(!a||!soundOn)return;
    tn(a,a.currentTime,hi?880:440,.14,hi?.35:.14,'square');},
  horn(){const a=audio();if(!a||!soundOn)return;const t=a.currentTime;
    [196,262,330].forEach((f,i)=>tn(a,t+i*.005,f,.16,.85,'sawtooth'));}
};
const haptic=m=>{if(navigator.vibrate){try{navigator.vibrate(m);}catch(e){}}};

/* ================= NET ================= */
const STRANDS=12,ROWS=6,NET_DROP=.44;
let net=[],vL=[],hL=[];
function buildNet(){
  net=[];vL=[];hL=[];
  for(let r=0;r<ROWS;r++){
    const f=r/(ROWS-1),rad=RIM_R*(1-.4*f),y=RIM_Y-NET_DROP*(f*f*.6+f*.4);
    for(let s=0;s<STRANDS;s++){
      const a=(s/STRANDS)*TAU,x=Math.cos(a)*rad,z=HOOP_Z+Math.sin(a)*rad;
      net.push({x,y,z,px:x,py:y,pz:z,rx:x,ry:y,rz:z,pin:r===0});
    }
  }
  const at=(s,r)=>net[r*STRANDS+s],D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
  for(let r=0;r<ROWS-1;r++)for(let s=0;s<STRANDS;s++){const a=at(s,r),b=at(s,r+1);vL.push({a,b,len:D(a,b)});}
  for(let r=1;r<ROWS;r++)for(let s=0;s<STRANDS;s++){const a=at(s,r),b=at((s+1)%STRANDS,r);hL.push({a,b,len:D(a,b)});}
}
function solve(L,st){
  const a=L.a,b=L.b;let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
  const d=Math.hypot(dx,dy,dz)||1e-6,k=((d-L.len)/d)*.5*st;
  dx*=k;dy*=k;dz*=k;
  if(!a.pin){a.x+=dx;a.y+=dy;a.z+=dz;}if(!b.pin){b.x-=dx;b.y-=dy;b.z-=dz;}
}
function stepNet(dt){
  const DAMP=.94,G=9,REC=.055;
  for(const n of net){if(n.pin)continue;
    const nx=n.x+(n.x-n.px)*DAMP,ny=n.y+(n.y-n.py)*DAMP-G*dt*dt,nz=n.z+(n.z-n.pz)*DAMP;
    n.px=n.x;n.py=n.y;n.pz=n.z;n.x=nx;n.y=ny;n.z=nz;}
  for(let i=0;i<3;i++){for(const L of vL)solve(L,1);for(const L of hL)solve(L,.7);}
  for(const n of net){if(n.pin)continue;
    n.x+=(n.rx-n.x)*REC;n.y+=(n.ry-n.y)*REC;n.z+=(n.rz-n.z)*REC;}
}
function netVsBall(b){
  const reach=BALL_R+.035;
  for(const n of net){if(n.pin)continue;
    const dx=n.x-b.x,dy=n.y-b.y,dz=n.z-b.z,d=Math.hypot(dx,dy,dz);
    if(d<reach&&d>1e-5){const k=(reach-d)/d;n.x+=dx*k;n.y+=dy*k;n.z+=dz*k;
      const w=P.whip*.01;n.x+=b.vx*w;n.y+=b.vy*w;n.z+=b.vz*w;}}
}

/* ================= JUICE ================= */
let parts=[],pops=[],flash=0,barFlash=null;
function spark(x,y,z,vx,vy,vz,col,life,size){
  parts.push({x,y,z,vx,vy,vz,col,life,max:life,size});
}
function burst(n,col,speed,fromY){
  for(let i=0;i<n*P.juice;i++){
    const a=Math.random()*TAU,e=Math.random()*.9+.1,s=speed*(.4+Math.random()*.9);
    spark(Math.cos(a)*RIM_R*.7,fromY,HOOP_Z+Math.sin(a)*RIM_R*.7,
      Math.cos(a)*s,e*s*.8,Math.sin(a)*s,col,.5+Math.random()*.5,2+Math.random()*3);
  }
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.vy-=7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.vx*=.985;p.vz*=.985;p.life-=dt;
    if(p.life<=0||p.y<-.5)parts.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){
    const q=pops[i];q.life-=dt;q.y-=52*dt;
    if(q.life<=0)pops.splice(i,1);
  }
}
function pop(text,col,worldY){
  const p=px(0,worldY,HOOP_Z);
  pops.push({x:p.x,y:p.y,text,col,life:1.05,max:1.05});
}

/* ================= STATE ================= */
let phase='idle',countAt=0,countStep=-1;
let ball,score=0,shownScore=0,swishStreak=0,bestStreak=0,swishes=0,makes=0,perfects=0;
let shotsTaken=0,sessionBest=0,hot=false;
let slowUntil=0,shake=0,trail=[];
let drag=null,hold=null,coachDone=false;

function newBall(){
  ball={x:(Math.random()*2-1)*1.15,y:LAUNCH_Y,z:LAUNCH_Z,vx:0,vy:0,vz:0,spin:0,
    live:false,done:false,resolveAt:0,hitRim:false,hitBoard:false,scored:false,
    above:true,stopped:false,perfect:false};
  trail=[];
}
function startRound(){
  audio();
  score=0;shownScore=0;swishStreak=0;bestStreak=0;swishes=0;makes=0;perfects=0;
  shotsTaken=0;slowUntil=0;shake=0;drag=null;hold=null;hot=false;
  parts=[];pops=[];flash=0;barFlash=null;
  buildNet();newBall();paintHud();setBtn('SHOOT','');
  overlay.classList.remove('show');
  coach.classList.add('hide');coachDone=false;
  shotBtn.classList.add('hidden');
  phase='count';countAt=performance.now();countStep=-1;
}
function beginPlay(){
  phase='playing';
  shotBtn.classList.toggle('hidden',mode!=='hold');
  setCoachText();coach.classList.remove('hide');
}
function endRound(){
  phase='over';hold=null;drag=null;hot=false;
  shotBtn.classList.add('hidden');coach.classList.add('hide');
  sessionBest=Math.max(sessionBest,score);
  S.horn();haptic([0,30,60,30]);showOver();
}
function toIdle(){
  phase='idle';drag=null;hold=null;hot=false;
  shotBtn.classList.add('hidden');coach.classList.add('hide');
  verdictEl.className='';verdictEl.textContent='';
  parts=[];pops=[];flash=0;
  buildNet();newBall();score=0;shownScore=0;swishStreak=0;shotsTaken=0;paintHud();
  closeTuner();showStart();
}

/* ================= AIM ================= */
const chargeToSpeed=c=>(SP_MIN+SP_SPAN*c)*P.maxSpeed;
const speedToCharge=s=>(s/P.maxSpeed-SP_MIN)/SP_SPAN;
const elevFor=dy=>Math.max(.72,Math.min(1.18,.96-(dy/(H*.4))*.20));
const bearing=()=>Math.atan2(-ball.x,HOOP_Z-ball.z);
const latFor=dx=>bearing()+(dx/(W*.5))*.30;

function aimHold(h){
  const elev=elevFor(h.dy),lat=latFor(h.dx);
  const sp=chargeToSpeed(h.charge),vh=sp*Math.cos(elev);
  return {vx:vh*Math.sin(lat),vy:sp*Math.sin(elev),vz:vh*Math.cos(lat)};
}
function aimFlick(d){
  const up=d.sy-d.cy,sx=d.cx-d.sx,len=Math.hypot(sx,up);
  if(up<18||len<24)return null;
  const power=Math.min(1.45,Math.max(.18,len/(H*.42)));
  const steep=Math.max(0,Math.min(1,up/len));
  const elev=.62+(1.1-.62)*steep,lat=Math.atan2(sx,Math.max(up,1))*.55;
  const sp=power*P.maxSpeed,vh=sp*Math.cos(elev);
  return {vx:vh*Math.sin(lat),vy:sp*Math.sin(elev),vz:vh*Math.cos(lat)};
}
function currentAim(){
  if(phase!=='playing'||!ball||ball.live||ball.done)return null;
  if(mode==='hold'&&hold)return aimHold(hold);
  if(mode==='flick'&&drag)return aimFlick(drag);
  return null;
}
function fire(a,perfect){
  if(!a||phase!=='playing'||!ball||ball.live||ball.done)return;
  ball.vx=a.vx;ball.vy=a.vy;ball.vz=a.vz;ball.live=true;ball.perfect=!!perfect;
  if(!coachDone){coachDone=true;coach.classList.add('hide');}
}
function chargeForRange(range,elev){
  const dy=RIM_Y-ball.y,t=Math.tan(elev),c=Math.cos(elev);
  const den=range*t-dy;
  if(den<=0.01)return null;
  return speedToCharge(Math.sqrt(P.gravity*range*range/(2*c*c*den)));
}
function entryAngle(elev,range){
  const c=chargeForRange(range,elev);if(c==null)return 0;
  const s=chargeToSpeed(c),vh=s*Math.cos(elev),vy0=s*Math.sin(elev);
  return Math.atan2(-(vy0-P.gravity*(range/vh)),vh)*180/Math.PI;
}
function releaseWindow(dx,dy){
  const elev=elevFor(dy),range=Math.hypot(ball.x,HOOP_Z-ball.z);
  const tol=MAKE_R+P.assist*0.10;
  const perfect=chargeForRange(range,elev);
  const lo=chargeForRange(range-tol,elev),hi=chargeForRange(range+tol,elev);
  const sideErr=range*Math.sin(latFor(dx)-bearing());
  return {perfect,lo,hi,elev,entry:entryAngle(elev,range),sideErr,
    reachable:perfect!=null&&perfect>-.02&&perfect<1.02};
}
function arcWord(e){
  if(e<25)return 'TOO FLAT';if(e<34)return 'FLAT';
  if(e>62)return 'RAINBOW';if(e>52)return 'HIGH';return 'GOOD ARC';
}

/* ================= PHYSICS ================= */
function stepBall(dt,now){
  const b=ball;if(!b.live)return;
  if(P.assist>0&&b.vy<0&&b.y>RIM_Y&&b.y<RIM_Y+.95){
    const dx=-b.x,dz=HOOP_Z-b.z,d=Math.hypot(dx,dz);
    if(d>.02&&d<.6){const f=P.assist*3.8*(1-d/.6);b.vx+=(dx/d)*f*dt;b.vz+=(dz/d)*f*dt;}
  }
  b.vy-=P.gravity*dt;
  const py=b.y,pz=b.z;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
  b.spin+=Math.hypot(b.vx,b.vy,b.vz)*dt*2.4;
  if(hot&&P.juice>0&&Math.random()<.6)
    spark(b.x,b.y,b.z,(Math.random()-.5)*.5,Math.random()*.7,(Math.random()-.5)*.5,
      Math.random()<.5?'#FF6B2C':'#FFD84D',.32,3+Math.random()*3);
  if(P.slomo>0&&!b.stopped&&b.vy<0&&b.y<RIM_Y+.55&&b.y>RIM_Y-.1
     &&Math.hypot(b.x,b.z-HOOP_Z)<.68){b.stopped=true;slowUntil=now+90;}
  if(pz+BALL_R<=BOARD_Z&&b.z+BALL_R>BOARD_Z&&Math.abs(b.x)<BOARD_X
     &&b.y>RIM_Y-.05&&b.y<BOARD_TOP){
    b.z=BOARD_Z-BALL_R;b.vz=-Math.abs(b.vz)*.62;b.vy*=.92;
    b.hitBoard=true;S.board();haptic(12);shake=Math.max(shake,3);
  }
  const hx=b.x,hz=b.z-HOOP_Z,hd=Math.hypot(hx,hz);
  if(hd>1e-4){
    const rx=(hx/hd)*RIM_R,rz=(hz/hd)*RIM_R;
    const dx=b.x-rx,dy=b.y-RIM_Y,dz=b.z-(HOOP_Z+rz),d=Math.hypot(dx,dy,dz);
    if(d<BALL_R&&d>1e-5){
      const nx=dx/d,ny=dy/d,nz=dz/d,pen=BALL_R-d;
      b.x+=nx*pen;b.y+=ny*pen;b.z+=nz*pen;
      const dot=b.vx*nx+b.vy*ny+b.vz*nz;
      b.vx=(b.vx-2*dot*nx)*.56;b.vy=(b.vy-2*dot*ny)*.56;b.vz=(b.vz-2*dot*nz)*.56;
      if(!b.hitRim||Math.abs(dot)>1.2){S.rim();haptic(10);shake=Math.max(shake,4);}
      b.hitRim=true;
    }
  }
  if(b.above&&py>=RIM_Y&&b.y<RIM_Y&&b.vy<0){
    b.above=false;
    if(Math.hypot(b.x,b.z-HOOP_Z)<MAKE_R)make(b);
  }
  if(b.y>RIM_Y+.05)b.above=true;
  if(b.y-BALL_R<0&&b.vy<0){
    b.y=BALL_R;b.vy=-b.vy*.56;b.vx*=.84;b.vz*=.84;
    if(Math.abs(b.vy)>.6)S.bounce(Math.abs(b.vy));else b.vy=0;
  }
  netVsBall(b);
  trail.push({x:b.x,y:b.y,z:b.z});if(trail.length>14)trail.shift();
  if(!b.done){
    const gone=b.z>9||b.z<-2.5||Math.abs(b.x)>4;
    const dead=b.y<BALL_R+.02&&Math.abs(b.vy)<.5&&Math.hypot(b.vx,b.vz)<.6;
    if(b.scored&&b.y<RIM_Y-.85){b.done=true;b.resolveAt=now+700;}
    else if(gone||dead){b.done=true;b.resolveAt=now+520;if(!b.scored)missed();}
  }
}
function make(b){
  b.scored=true;makes++;
  const clean=!b.hitRim&&!b.hitBoard;
  if(clean){
    swishStreak++;swishes++;bestStreak=Math.max(bestStreak,swishStreak);
    let pts=3+Math.min(3,swishStreak-1);
    if(b.perfect){pts+=1;perfects++;}
    const wasHot=hot;
    if(swishStreak>=HEAT_AT)hot=true;
    if(hot)pts*=2;
    score+=pts;
    S.swish();S.ladder(swishStreak-1);S.crowd(Math.min(1,swishStreak/4));
    if(b.perfect)S.perfect();
    haptic([0,18,40,26]);shake=9;flash=Math.max(flash,.5);
    burst(hot?26:16,hot?'#FF6B2C':'#FFF4E6',hot?2.6:1.9,RIM_Y-.1);
    pop('+'+pts,hot?'#FF6B2C':'#FFD84D',RIM_Y+.35);
    if(hot&&!wasHot){S.ignite();haptic([0,40,50,40,50,60]);flash=.85;
      showVerdict('ON FIRE',false,true);burst(40,'#FF6B2C',3.2,RIM_Y);}
    else showVerdict(b.perfect?'PERFECT':(swishStreak>1?'SWISH ×'+swishStreak:'SWISH'),false,hot);
  }else{
    score+=hot?4:2;swishStreak=0;hot=false;
    S.swish();S.crowd(.35);haptic(14);shake=5;
    burst(8,'#FFF4E6',1.2,RIM_Y-.1);pop('+'+(2),'#FFF4E6',RIM_Y+.35);
    showVerdict(b.hitBoard?'OFF THE GLASS':'RATTLES IN',false);
  }
  paintHud();
}
function missed(){
  if(swishStreak>0)S.groan();
  swishStreak=0;hot=false;paintHud();
  showVerdict(ball.hitRim||ball.hitBoard?'No good':'Air ball',true);
}

/* ================= HUD ================= */
const scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak');
const streakWrap=document.getElementById('streakWrap'),dotsEl=document.getElementById('dots');
const verdictEl=document.getElementById('verdict'),shotBtn=document.getElementById('shot');
const shotLabel=document.getElementById('shotLabel'),coach=document.getElementById('coach');
const overlay=document.getElementById('overlay'),card=document.getElementById('card');
function paintHud(){
  streakEl.textContent=swishStreak;
  streakWrap.classList.toggle('hot',hot);
  const left=Math.max(0,BALLS_PER_ROUND-shotsTaken);
  let h='';for(let i=0;i<BALLS_PER_ROUND;i++)h+='<i class="'+(i<left?'':'spent')+'"></i>';
  dotsEl.innerHTML=h;
}
let btnState='';
function setBtn(label,cls){
  if(shotLabel.textContent!==label)shotLabel.textContent=label;
  if(btnState!==cls){shotBtn.classList.remove('now','over');
    if(cls)shotBtn.classList.add(cls);btnState=cls;}
}
function showVerdict(t,miss,fire){
  verdictEl.textContent=t;verdictEl.className='';
  void verdictEl.offsetWidth;
  verdictEl.className='show'+(miss?' miss':'')+(fire?' fire':'');
}
function setCoachText(){
  coach.innerHTML=mode==='hold'
    ? 'Hold the button · release in the green<br>Slide left / right to aim, up / down for arc'
    : 'Swipe up anywhere to shoot<br>Length is power · angle is aim';
}
function showStart(){
  card.innerHTML='<p class="eyebrow">'+BALLS_PER_ROUND+' balls</p><h1>SW<em>I</em>SH</h1>'+
    '<p class="sub">Hold the button and release inside the green window. '+
    'Three swishes in a row and you catch fire — points double until you miss.</p>'+
    '<button id="start">Start</button>'+
    (sessionBest?'<p class="best">Best this session · '+sessionBest+'</p>':'');
  overlay.classList.add('show');
  document.getElementById('start').addEventListener('click',startRound);
}
function showOver(){
  card.innerHTML='<p class="eyebrow">Round over</p><h1>'+score+'</h1>'+
    '<div class="breakdown">'+
    '<div><b>'+makes+'/'+BALLS_PER_ROUND+'</b><span>Made</span></div>'+
    '<div><b>'+swishes+'</b><span>Swishes</span></div>'+
    '<div><b>'+perfects+'</b><span>Perfect</span></div>'+
    '<div><b>'+bestStreak+'</b><span>Best run</span></div></div>'+
    '<button id="start">Play again</button>'+
    '<p class="best">Best this session · '+Math.max(sessionBest,score)+'</p>';
  overlay.classList.add('show');
  document.getElementById('start').addEventListener('click',startRound);
}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(.05,(now-last)/1000);last=now;

  if(phase==='count'){
    const el=(now-countAt)/1000,step=Math.floor(el/.62);
    if(step!==countStep&&step<4){countStep=step;S.beep(step===3);haptic(step===3?30:12);}
    if(el>2.55)beginPlay();
  }
  if(hold&&mode==='hold'&&phase==='playing'){
    const t=((now-hold.startAt)/1000)*P.charge,ph=t%2;
    hold.charge=ph<1?ph:2-ph;
    const w=releaseWindow(hold.dx,hold.dy);
    const inZone=w.reachable&&w.lo!=null&&w.hi!=null&&hold.charge>=w.lo&&hold.charge<=w.hi;
    if(inZone!==hold.inZone){hold.inZone=inZone;
      if(inZone){S.enter();haptic(16);}else S.leave();}
    hold.perfect=w.perfect!=null&&w.lo!=null&&w.hi!=null&&
      Math.abs(hold.charge-w.perfect)<Math.max(.012,(w.hi-w.lo)*.16);
    if(w.perfect!=null){
      const near=Math.max(0,1-Math.abs(hold.charge-w.perfect)/.35);
      const stepSize=inZone?.012:(.10-.07*near);
      const st=Math.floor(hold.charge/stepSize);
      if(st!==hold.lastTick){hold.lastTick=st;
        S.tick(360+1100*near,inZone?.05:.022+near*.03);}
    }
    setBtn(inZone?'NOW':(w.reachable&&w.hi!=null&&hold.charge>w.hi?'OVER':'HOLD'),
           inZone?'now':(w.reachable&&w.hi!=null&&hold.charge>w.hi?'over':''));
  }

  const ts=now<slowUntil?(1-P.slomo*.72):1;
  const dt=(1/120)*ts;
  for(let i=0;i<2;i++){stepBall(dt,now);stepNet(1/120);}
  stepParts(rdt);
  shownScore+=(score-shownScore)*Math.min(1,rdt*9);
  if(Math.abs(score-shownScore)<.5)shownScore=score;
  scoreEl.textContent=Math.round(shownScore);
  if(ball.done&&now>ball.resolveAt){
    if(phase==='playing'){
      shotsTaken++;paintHud();
      if(shotsTaken>=BALLS_PER_ROUND){newBall();endRound();}
      else{newBall();setBtn('SHOOT','');}
    }else newBall();
  }
  shake*=.88;flash*=.86;
  if(barFlash&&now>barFlash.until)barFlash=null;
  draw(now);
}

/* ================= DRAW ================= */
function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>.4)ctx.translate((Math.random()-.5)*shake*P.juice,(Math.random()-.5)*shake*P.juice);
  arena();board();rimArc(true);drawNet(false);
  const a=currentAim();if(a&&P.guide>0)preview(a);
  drawBall();drawNet(true);rimArc(false);
  drawParts();
  ctx.restore();
  drawPops();
  if(flash>.01){ctx.fillStyle=(hot?'rgba(255,107,44,':'rgba(255,244,230,')+(flash*.30*P.juice)+')';
    ctx.fillRect(0,0,W,H);}
  if(mode==='hold'&&phase==='playing'&&ball&&!ball.live&&!ball.done)powerBar(now);
  if(phase==='count')countdown(now);
}
function arena(){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(hot){g.addColorStop(0,'#2A0D12');g.addColorStop(.52,'#42121C');g.addColorStop(1,'#6B2A1C');}
  else{g.addColorStop(0,'#180B18');g.addColorStop(.52,'#2C1220');g.addColorStop(1,'#4A2320');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const h=px(0,RIM_Y,HOOP_Z);
  const gl=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,H*.42);
  gl.addColorStop(0,hot?'rgba(255,120,50,.34)':'rgba(255,180,90,.20)');
  gl.addColorStop(1,'rgba(255,180,90,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,244,230,.05)';ctx.lineWidth=1;
  for(let z=0;z<=8;z++){const a=px(-4,0,z),b=px(4,0,z);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.strokeStyle='rgba(255,244,230,.10)';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=40;i++){const a=Math.PI+(i/40)*Math.PI;
    const p=px(Math.cos(a)*2.4,0,HOOP_Z+Math.sin(a)*2.4-2.4);
    i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}
  ctx.stroke();
  if(ball&&!ball.live&&phase==='playing'){const p=px(ball.x,0,LAUNCH_Z);
    ctx.strokeStyle='rgba(255,122,47,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(p.x,p.y,26*p.s,8*p.s,0,0,TAU);ctx.stroke();}
}
function board(){
  const c=[px(-BOARD_X,BOARD_TOP,BOARD_Z),px(BOARD_X,BOARD_TOP,BOARD_Z),
           px(BOARD_X,RIM_Y-.28,BOARD_Z),px(-BOARD_X,RIM_Y-.28,BOARD_Z)];
  ctx.beginPath();ctx.moveTo(c[0].x,c[0].y);
  for(let i=1;i<4;i++)ctx.lineTo(c[i].x,c[i].y);ctx.closePath();
  ctx.fillStyle='rgba(255,244,230,.07)';ctx.fill();
  ctx.strokeStyle='rgba(255,244,230,.34)';ctx.lineWidth=2;ctx.stroke();
  const t=[px(-.3,RIM_Y+.62,BOARD_Z),px(.3,RIM_Y+.62,BOARD_Z),
           px(.3,RIM_Y+.05,BOARD_Z),px(-.3,RIM_Y+.05,BOARD_Z)];
  ctx.beginPath();ctx.moveTo(t[0].x,t[0].y);
  for(let i=1;i<4;i++)ctx.lineTo(t[i].x,t[i].y);ctx.closePath();
  ctx.strokeStyle='rgba(255,71,87,.75)';ctx.lineWidth=2.5;ctx.stroke();
}
function rimArc(back){
  ctx.beginPath();let on=false;
  for(let i=0;i<=48;i++){
    const a=(i/48)*TAU,z=HOOP_Z+Math.sin(a)*RIM_R;
    if((z>HOOP_Z)!==back){on=false;continue;}
    const p=px(Math.cos(a)*RIM_R,RIM_Y,z);
    if(!on){ctx.moveTo(p.x,p.y);on=true;}else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle=back?(hot?'rgba(255,180,60,.6)':'rgba(255,71,87,.55)')
                     :(hot?'#FFB43C':'#FF4757');
  ctx.lineWidth=back?4:6;ctx.lineCap='round';
  if(!back){ctx.shadowColor=hot?'rgba(255,150,40,.95)':'rgba(255,71,87,.6)';
    ctx.shadowBlur=hot?26:14;}
  ctx.stroke();ctx.shadowBlur=0;
}
function drawNet(front){
  const at=(s,r)=>net[r*STRANDS+s];
  ctx.lineWidth=1.6;ctx.lineCap='round';
  const A=front?'.92':'.40',B=front?'.55':'.22';
  for(let s=0;s<STRANDS;s++){
    if((Math.sin((s/STRANDS)*TAU)<=0)!==front)continue;
    ctx.beginPath();
    for(let r=0;r<ROWS;r++){const n=at(s,r),p=px(n.x,n.y,n.z);
      r?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}
    ctx.strokeStyle=(hot?'rgba(255,214,150,':'rgba(255,244,230,')+A+')';ctx.stroke();
  }
  for(let r=1;r<ROWS;r++)for(let s=0;s<STRANDS;s++){
    if((Math.sin((s/STRANDS)*TAU)<=0)!==front)continue;
    const a=at(s,r),b=at((s+1)%STRANDS,r);
    const p1=px(a.x,a.y,a.z),p2=px(b.x,b.y,b.z);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle=(hot?'rgba(255,214,150,':'rgba(255,244,230,')+B+')';ctx.stroke();
  }
}
function drawBall(){
  const b=ball,sh=px(b.x,.005,b.z),lift=Math.max(.15,1-b.y/4);
  ctx.fillStyle='rgba(0,0,0,.34)';ctx.beginPath();
  ctx.ellipse(sh.x,sh.y,BALL_R*PPM*sh.s*lift*1.15,BALL_R*PPM*sh.s*lift*.4,0,0,TAU);ctx.fill();
  trail.forEach((t,i)=>{const p=px(t.x,t.y,t.z);
    ctx.globalAlpha=(i/trail.length)*(hot?.5:.26);
    ctx.fillStyle=hot?'#FF6B2C':'#FF7A2F';
    ctx.beginPath();ctx.arc(p.x,p.y,BALL_R*PPM*p.s*(.35+i/trail.length*(hot?.8:.5)),0,TAU);ctx.fill();});
  ctx.globalAlpha=1;
  const p=px(b.x,b.y,b.z),r=BALL_R*PPM*p.s;
  if(hot){ctx.shadowColor='rgba(255,120,40,.95)';ctx.shadowBlur=28;}
  const g=ctx.createRadialGradient(p.x-r*.35,p.y-r*.4,r*.1,p.x,p.y,r);
  g.addColorStop(0,hot?'#FFE9A8':'#FFA761');g.addColorStop(1,hot?'#FF4A12':'#D8531A');
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(b.spin);
  ctx.strokeStyle='rgba(60,18,8,.72)';ctx.lineWidth=Math.max(1,r*.09);
  ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,r*.46,r,0,0,TAU);ctx.stroke();ctx.restore();
}
function preview(a){
  let x=ball.x,y=ball.y,z=ball.z,vx=a.vx,vy=a.vy,vz=a.vz;
  const dt=1/40,green=hold&&hold.inZone;
  ctx.fillStyle=green?'rgba(120,255,180,.8)':'rgba(255,244,230,.30)';
  for(let i=0;i<52;i++){
    vy-=P.gravity*dt;x+=vx*dt;y+=vy*dt;z+=vz*dt;
    if(y<0||z>HOOP_Z+1.6)break;
    if(i%2)continue;
    const p=px(x,y,z);ctx.globalAlpha=.72-i/78;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.4,3.2*p.s),0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(P.guide<2||!hold)return;
  const w=releaseWindow(hold.dx,hold.dy);
  const p=px(w.sideErr||0,RIM_Y,HOOP_Z),rr=RIM_R*PPM*p.s;
  ctx.strokeStyle=green?'rgba(120,255,180,.9)':'rgba(255,244,230,.38)';
  ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,rr,rr*.34,0,0,TAU);ctx.stroke();
}
function drawParts(){
  for(const p of parts){
    const q=px(p.x,p.y,p.z);
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(q.x,q.y,p.size*q.s,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawPops(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const q of pops){
    const t=q.life/q.max;
    ctx.globalAlpha=Math.min(1,t*1.8);
    ctx.font='400 '+Math.round(30+16*(1-t))+'px Anton, ui-sans-serif, sans-serif';
    ctx.fillStyle=q.col;ctx.fillText(q.text,q.x,q.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function countdown(now){
  const el=(now-countAt)/1000,step=Math.floor(el/.62);
  const txt=step>=3?'GO':String(3-step);
  const f=(el/.62)%1;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=Math.max(0,1-f*.85);
  ctx.font='400 '+Math.round(H*.16*(1+f*.5))+'px Anton, ui-sans-serif, sans-serif';
  ctx.fillStyle=step>=3?'#78FFB4':'#FFD84D';
  ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=40;
  ctx.fillText(txt,W/2,H*.42);ctx.restore();
}

/* ---- THE POWER BAR: parked above the hand, never under the thumb ---- */
function powerBar(now){
  const w=releaseWindow(hold?hold.dx:0,hold?hold.dy:0);
  const c=hold?hold.charge:null;
  const pad=22,bw=W-pad*2,bh=30;
  const by=Math.round(H*P.barpos),bx=pad;
  const R=8;

  const rr=(x,y,ww,hh,r)=>{ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+ww-r,y);ctx.quadraticCurveTo(x+ww,y,x+ww,y+r);
    ctx.lineTo(x+ww,y+hh-r);ctx.quadraticCurveTo(x+ww,y+hh,x+ww-r,y+hh);
    ctx.lineTo(x+r,y+hh);ctx.quadraticCurveTo(x,y+hh,x,y+hh-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();};

  // labels
  ctx.font='600 10px ui-sans-serif, system-ui, sans-serif';
  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';
  ctx.fillStyle=w.reachable?'rgba(255,244,230,.55)':'rgba(255,71,87,.9)';
  ctx.fillText(w.reachable?arcWord(w.entry)+'  '+Math.round(w.entry)+'°':'ARC TOO LOW — SLIDE UP',bx+2,by-11);
  ctx.textAlign='right';
  const side=w.sideErr||0,off=Math.abs(side)*100;
  if(off<6){ctx.fillStyle='rgba(120,255,180,.9)';ctx.fillText('ON LINE',bx+bw-2,by-11);}
  else{ctx.fillStyle='rgba(255,244,230,.55)';
    ctx.fillText((side>0?'RIGHT ':'LEFT ')+Math.round(off)+'cm',bx+bw-2,by-11);}

  // track
  rr(bx,by,bw,bh,R);
  ctx.fillStyle='rgba(12,5,12,.72)';ctx.fill();
  ctx.strokeStyle=barFlash?barFlash.col:'rgba(255,244,230,.20)';
  ctx.lineWidth=barFlash?3:1.5;ctx.stroke();

  ctx.save();rr(bx,by,bw,bh,R);ctx.clip();

  // green window
  if(w.reachable&&w.lo!=null&&w.hi!=null){
    const lo=Math.max(0,Math.min(1,w.lo)),hi=Math.max(0,Math.min(1,w.hi));
    const gx=bx+bw*lo,gw=Math.max(6,bw*(hi-lo));
    const gg=ctx.createLinearGradient(gx,0,gx+gw,0);
    gg.addColorStop(0,'rgba(120,255,180,.30)');
    gg.addColorStop(.5,'rgba(120,255,180,.62)');
    gg.addColorStop(1,'rgba(120,255,180,.30)');
    ctx.fillStyle=gg;ctx.fillRect(gx,by,gw,bh);
    if(w.perfect!=null){
      const pxp=bx+bw*Math.max(0,Math.min(1,w.perfect));
      ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(pxp-1.5,by,3,bh);
    }
  }
  // charge fill
  if(c!=null){
    const fg=ctx.createLinearGradient(bx,0,bx+bw*c,0);
    fg.addColorStop(0,'rgba(255,122,47,.35)');fg.addColorStop(1,'rgba(255,216,77,.75)');
    ctx.fillStyle=fg;ctx.fillRect(bx,by,bw*c,bh);
  }
  // LED segment dividers
  ctx.fillStyle='rgba(12,5,12,.62)';
  for(let i=1;i<26;i++)ctx.fillRect(bx+(bw/26)*i-1.5,by,3,bh);
  ctx.restore();

  // needle
  if(c!=null){
    const nx=bx+bw*c;
    ctx.fillStyle=hold.inZone?'#78FFB4':'#FFD84D';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=hold.inZone?18:8;
    ctx.fillRect(nx-2,by-6,4,bh+12);
    ctx.beginPath();ctx.moveTo(nx-8,by-8);ctx.lineTo(nx+8,by-8);ctx.lineTo(nx,by+2);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  }

  // NOW! call
  if(hold&&hold.inZone){
    const pulse=1+Math.sin(now/70)*.07;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.translate(W/2,by+bh+26);ctx.scale(pulse,pulse);
    ctx.font='400 26px Anton, ui-sans-serif, sans-serif';
    ctx.fillStyle=hold.perfect?'#FFF4E6':'#78FFB4';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=22;
    ctx.fillText(hold.perfect?'PERFECT!':'RELEASE!',0,0);
    ctx.restore();ctx.shadowBlur=0;
  }
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{
  audio();if(mode!=='flick'||phase!=='playing')return;
  if(!ball||ball.live||ball.done)return;
  drag={sx:e.clientX,sy:e.clientY,cx:e.clientX,cy:e.clientY};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{if(drag){drag.cx=e.clientX;drag.cy=e.clientY;}});
cv.addEventListener('pointerup',()=>{if(drag){fire(aimFlick(drag),false);drag=null;}});
cv.addEventListener('pointercancel',()=>{drag=null;});

shotBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  if(mode!=='hold'||phase!=='playing'||!ball||ball.live||ball.done)return;
  hold={startAt:performance.now(),ox:e.clientX,oy:e.clientY,dx:0,dy:0,
        charge:0,lastTick:-1,inZone:false,perfect:false};
  shotBtn.setPointerCapture(e.pointerId);
});
shotBtn.addEventListener('pointermove',e=>{
  if(!hold)return;hold.dx=e.clientX-hold.ox;hold.dy=e.clientY-hold.oy;
});
shotBtn.addEventListener('pointerup',()=>{
  if(!hold)return;
  barFlash={col:hold.inZone?'rgba(120,255,180,.95)':'rgba(255,71,87,.8)',
            until:performance.now()+260};
  fire(aimHold(hold),hold.perfect);
  hold=null;setBtn('SHOOT','');
});
shotBtn.addEventListener('pointercancel',()=>{hold=null;setBtn('SHOOT','');});
addEventListener('blur',()=>{hold=null;drag=null;setBtn('SHOOT','');});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= CONTROLS ================= */
const tunerEl=document.getElementById('tuner'),scrim=document.getElementById('scrim');
function openTuner(){tunerEl.classList.add('open');scrim.classList.add('open');}
function closeTuner(){tunerEl.classList.remove('open');scrim.classList.remove('open');}
document.getElementById('tune').addEventListener('click',()=>{
  audio();tunerEl.classList.contains('open')?closeTuner():openTuner();});
document.getElementById('done').addEventListener('click',closeTuner);
scrim.addEventListener('click',closeTuner);
addEventListener('keydown',e=>{if(e.key==='Escape')closeTuner();});
document.getElementById('reset').addEventListener('click',()=>{audio();toIdle();});
const soundBtn=document.getElementById('sound');
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;audio();
  soundBtn.textContent=soundOn?'Sound':'Muted';});

const mHold=document.getElementById('m-hold'),mFlick=document.getElementById('m-flick');
function setMode(m){
  mode=m;drag=null;hold=null;
  mHold.setAttribute('aria-pressed',String(m==='hold'));
  mFlick.setAttribute('aria-pressed',String(m==='flick'));
  shotBtn.classList.toggle('hidden',m!=='hold'||phase!=='playing');
  setCoachText();
  if(phase==='playing'&&!coachDone)coach.classList.remove('hide');
}
mHold.addEventListener('click',()=>setMode('hold'));
mFlick.addEventListener('click',()=>setMode('flick'));

[['charge','charge',2],['power','maxSpeed',1],['grav','gravity',1],['assist','assist',2],
 ['slomo','slomo',2],['whip','whip',2],['juice','juice',2],['guide','guide',0],['barpos','barpos',2]]
.forEach(([id,key,dp])=>{
  const el=document.getElementById('s-'+id),out=document.getElementById('o-'+id);
  const sync=()=>{P[key]=parseFloat(el.value);
    out.textContent=id==='guide'?['Off','Arc','Arc + ring'][P[key]]:P[key].toFixed(dp);};
  el.addEventListener('input',sync);sync();
});

const sw=document.getElementById('scoreWrap');
sw.style.pointerEvents='auto';let hT=null;
sw.addEventListener('pointerdown',()=>{hT=setTimeout(toIdle,800);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
  sw.addEventListener(ev,()=>clearTimeout(hT)));
